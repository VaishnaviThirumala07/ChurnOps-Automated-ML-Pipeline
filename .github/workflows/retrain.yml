name: ML Training Pipeline

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ drift_retrain ]
  workflow_dispatch:

env:
  # Fall back to a local SQLite store when no remote MLflow server is configured
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'sqlite:///ci_mlflow.db' }}

jobs:
  train-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Tests
        run: python -m pytest tests -q

      - name: Pull DVC Data from Remote
        env:
          # Set DAGSHUB_USER_TOKEN in GitHub Secrets for DagsHub remote
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          dvc pull || echo "DVC pull skipped (no remote configured)"

      - name: Run DVC Pipeline
        run: |
          mkdir -p logs
          dvc repro

      - name: Promote Model to Production
        run: python src/utils/promote_model.py

      - name: Build Docker Image
        run: |
          docker build -t churn-api:${{ github.sha }} -f deployment/Dockerfile .
          echo "Docker image churn-api:${{ github.sha }} built successfully"

      - name: Push Docker Image to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker tag churn-api:${{ github.sha }} $DOCKER_USERNAME/churn-api:latest
            docker push $DOCKER_USERNAME/churn-api:latest
            echo "Docker image pushed to DockerHub"
          else
            echo "DOCKER credentials not set — skipping push"
          fi

      - name: Upload Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: reports/
          if-no-files-found: warn
